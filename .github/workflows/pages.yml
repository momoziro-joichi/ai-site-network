name: Deploy five sites to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:all
        env:
          GITHUB_PAGES: 'true'
      - name: Assemble GitHub Pages
        run: |
          mkdir -p public-pages
          cp -R dist/weather dist/math dist/rail dist/english dist/tools public-pages/
          touch public-pages/.nojekyll
          cat > public-pages/index.html <<'HTML'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Site Network</title><style>body{font:1.1rem system-ui;margin:3rem auto;max-width:700px;padding:0 1rem}li{margin:1rem 0}</style></head><body><h1>AI Site Network</h1><p>無料の学習・計算ツール</p><ul><li><a href="./weather/">気象予報士の研究室</a></li><li><a href="./math/">数学・理工学ツールラボ</a></li><li><a href="./rail/">鉄道・地理データ研究所</a></li><li><a href="./english/">英語学習ラボ</a></li><li><a href="./tools/">便利ツール集</a></li></ul></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
