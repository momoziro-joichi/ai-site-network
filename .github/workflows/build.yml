name: Build and test five sites
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [weather, math, rail, english, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          SITE_KEY: ${{ matrix.site }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.site }}
          path: dist/${{ matrix.site }}
